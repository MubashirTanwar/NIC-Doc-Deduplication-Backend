<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-pastel-blue p-4">
        <div class="container mx-auto">
            <h1 class="text-white text-2xl font-bold">User Management</h1>
        </div>
    </nav>

    <!-- Form Section -->
    <div class="container mx-auto my-10 max-w-xl bg-white shadow-lg p-8 rounded-lg">
        <h2 class="text-2xl text-pastel-green font-semibold mb-4">Create a New User</h2>
        <form method="post" action="{% url 'create_user' %}" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="username" class="block text-lg text-gray-700">Username</label>
                <input type="text" id="username" name="username" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-pastel-green" required>
            </div>
            
            <div>
                <label for="organization" class="block text-lg text-gray-700">Organization</label>
                <input type="text" id="organization" name="organization" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-pastel-green" required>
            </div>
            
            <div>
                <label for="email" class="block text-lg text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-pastel-green" required>
            </div>

            <div class="text-right">
                <button type="submit" class="bg-pastel-green text-white font-bold py-3 px-6 rounded-lg shadow hover:bg-pastel-dark-green">
                    Create User
                </button>
            </div>
        </form>
    </div>

    <!-- Response Card Section -->
    {% if username %}
    <div class="container mx-auto mt-10 max-w-xl">
        <div class="bg-white shadow-lg p-8 rounded-lg">
            <h2 class="text-2xl text-pastel-green font-semibold mb-4">User Created Successfully!</h2>
            <div class="bg-gray-50 p-6 rounded-lg border border-gray-200">
                <table class="w-full text-left table-auto">
                    <tbody>
                        <tr>
                            <td class="font-semibold text-gray-600">Username:</td>
                            <td class="text-gray-700">{{ username }}</td>
                        </tr>
                        <tr>
                            <td class="font-semibold text-gray-600">Organization:</td>
                            <td class="text-gray-700">{{ organization }}</td>
                        </tr>
                        <tr>
                            <td class="font-semibold text-gray-600">Email:</td>
                            <td class="text-gray-700">{{ email }}</td>
                        </tr>
                        <tr>
                            <td class="font-semibold text-gray-600">Secret Key:</td>
                            <td class="text-gray-700">{{ secret_key }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <a class="mt-3 py-2 px-4 bg-blue-500 justify-end items-end flex" 
            href="/api/apikey">
                Create API Key
        </a>

        </div>
    </div>
    {% endif %}
    
    <style>
        .bg-pastel-blue {
            background-color: #a0d2eb;
        }
        .bg-pastel-green {
            background-color: #b2dfdb;
        }
        .bg-pastel-dark-green {
            background-color: #80cbc4;
        }
    </style>

</body>
</html>
